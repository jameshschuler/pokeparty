<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        font-family: Fredoka, sans-serif;
        color: #24123d;
        background: #6a2fbd;
        background-image: radial-gradient(#ff5aa5 3px, transparent 3px);
        background-size: 44px 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        width: 1080px;
        height: 510px;
        background: #f6f0ff;
        border: 8px solid #24123d;
        border-radius: 48px;
        box-shadow: 14px 14px 0 #24123d;
        padding: 32px 40px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .brand img {
        width: 80px;
        height: 80px;
      }
      h1 {
        font-size: 76px;
        font-weight: 700;
        line-height: 1;
        color: #6a2fbd;
        text-shadow: 5px 5px 0 #24123d;
      }
      .games {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 18px;
        flex: 1;
      }
      .game {
        background: #fff;
        border: 6px solid #24123d;
        border-radius: 28px;
        box-shadow: 6px 6px 0 #24123d;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 10px 16px 10px 10px;
      }
      .art {
        width: 130px;
        height: 130px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .art img {
        height: 110px;
      }
      .party img {
        height: 62px;
        margin: 0 -14px;
      }
      .silhouette img {
        filter: brightness(0);
        height: 110px;
      }
      .silhouette span {
        position: absolute;
        right: 0;
        top: -4px;
        font-size: 52px;
        font-weight: 700;
        color: #ff5aa5;
        text-shadow: 3px 3px 0 #24123d;
      }
      .dex {
        flex-direction: column;
      }
      .dex b {
        font-size: 36px;
        color: #6a2fbd;
        line-height: 1;
      }
      .dex img {
        height: 80px;
      }
      .simon,
      .match {
        display: grid;
        grid-template-columns: repeat(2, 54px);
        gap: 8px;
        justify-content: center;
        align-content: center;
      }
      .simon div,
      .match div {
        height: 54px;
        border: 4px solid #24123d;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      .simon div.lit {
        background: #ff5aa5;
        outline: 4px solid #24123d;
        outline-offset: 2px;
      }
      .simon img {
        height: 40px;
      }
      .match .back {
        background: #6a2fbd;
      }
      .match .back img {
        height: 30px;
      }
      .match .found {
        background: #d3eedd;
      }
      .match .found img {
        height: 42px;
      }
      .drop {
        flex-direction: column;
        gap: 2px;
      }
      .drop img {
        height: 74px;
      }
      .drop span {
        border: 3px solid #24123d;
        border-radius: 999px;
        background: #fff;
        padding: 0 10px;
        font-size: 22px;
        font-weight: 700;
        outline: 3px solid #6a2fbd;
      }
      .drop em {
        font-style: normal;
        color: #6a2fbd;
      }
      .label {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.05;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">
        <img src="../public/favicon.svg" />
        <h1>PokeParty</h1>
      </div>
      <div class="games">
        <div class="game">
          <div class="art party" id="party"></div>
          <div class="label">Party Builder</div>
        </div>
        <div class="game">
          <div class="art silhouette"><img id="mystery" /><span>?</span></div>
          <div class="label">Who's That Pokémon?</div>
        </div>
        <div class="game">
          <div class="art dex"><b>#0001</b><img id="dex" /></div>
          <div class="label">Dex Run</div>
        </div>
        <div class="game">
          <div class="art simon" id="simon"></div>
          <div class="label">Simon</div>
        </div>
        <div class="game">
          <div class="art match" id="match"></div>
          <div class="label">Pokémon Match</div>
        </div>
        <div class="game">
          <div class="art drop">
            <img id="drop" />
            <span><em>Psy</em>duck</span>
          </div>
          <div class="label">Name Drop</div>
        </div>
      </div>
    </div>
    <script>
      const base =
        "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/";
      for (const id of [6, 25, 94]) {
        const img = document.createElement("img");
        img.src = `${base}${id}.png`;
        party.append(img);
      }
      mystery.src = `${base}25.png`;
      dex.src = `${base}1.png`;
      drop.src = `${base}54.png`;
      for (const [id, lit] of [
        [7, false],
        [133, true],
        [39, false],
        [52, false],
      ]) {
        const tile = document.createElement("div");
        tile.className = lit ? "lit" : "";
        tile.innerHTML = `<img src="${base}${id}.png" />`;
        simon.append(tile);
      }
      for (const found of [false, true, true, false]) {
        const tile = document.createElement("div");
        tile.className = found ? "found" : "back";
        tile.innerHTML = found
          ? `<img src="${base}143.png" />`
          : `<img src="../public/favicon.svg" />`;
        match.append(tile);
      }
    </script>
  </body>
</html>
