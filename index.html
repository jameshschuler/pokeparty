<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6a2fbd" />
    <script>
      try {
        const theme = localStorage.getItem("pokeparty:theme");
        if (theme) {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>PokeParty</title>
    <meta
      name="description"
      content="Quiz yourself on Pokémon and build a party to share."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokeParty" />
    <meta
      property="og:title"
      content="PokeParty: Pokémon games and a party builder"
    />
    <meta
      property="og:description"
      content="Quiz yourself on Pokémon and build a party to share."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og-games.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PokeParty logo above cards for Party Builder, Who's That Pokémon?, Dex Run, Simon and Pokémon Match"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
